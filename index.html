<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>
  
  <!-- Service Worker強制解除用スクリプト -->
  <script src="./coi-serviceworker.js"></script>

  <!-- CSS関係 -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />

  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 50px); }
    .editor-container { flex: 1; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .terminal-container { flex: 1; padding: 10px; background: #000; }
    .CodeMirror { flex: 1; height: 100%; font-size: 14px; }
  </style>

  <!-- 1本で自己完結する、エラーの起きない通常JSライブラリ群 -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  
  <!-- WebContainer API（独立動作版） -->
  <script src="https://cloudflare.com"></script>
</head>
<body>
  <div id="app">
    <div class="header">
      <span>自作 Web IDE v1.0</span>
    </div>
    <div class="main-container">
      <div class="editor-container">
        <textarea id="code-editor"></textarea>
      </div>
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </div>
  
  <!-- 完全に名前を新しくしたスクリプトでキャッシュを強制突破 -->
  <script src="./final-ide.js?cache=destroy"></script>
</body>
</html>
