<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>

  <!-- Service Workerの過去の残骸を完全に消去 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) { registration.unregister(); }
      });
    }
  </script>

  <!-- ネットワーク制限を受けにくい安全な大手 cdnjs (Cloudflare) からCSSのみをロード -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />

  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px; border-bottom: 1px solid #333; font-weight: bold; background: #252526; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 40px); }
    .editor-container { flex: 1; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .terminal-container { flex: 1; padding: 10px; background: #000; }
    .CodeMirror { flex: 1; height: 100%; font-size: 14px; }
  </style>

  <!-- CORSエラーや自動通信バグを絶対に起こさない通常スクリプト形式（cdnjs経由） -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  
  <!-- WebContainer API（1本で独立動作するグローバル変数版を安全なcdnjsからロード） -->
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <div id="app">
    <div class="header">自作 Web IDE 起動テスト（完全単一ファイル版）</div>
    <div class="main-container">
      <div class="editor-container">
        <textarea id="code-editor"></textarea>
      </div>
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </div>

  <script>
    // ページの全アセットのロード完了を待つ
    window.addEventListener('load', () => {
      // 画面のレンダリング（描画）を確実に終わらせるために200ミリ秒待つ
      setTimeout(() => {
        const CodeMirror = window.CodeMirror;
        const Terminal = window.Terminal;
        const FitAddon = window.FitAddon ? window.FitAddon.FitAddon : null;
        const WebContainer = window.WebContainer;

        // --- 1. エディタの初期化 ---
        if (CodeMirror && !document.querySelector('.CodeMirror')) {
          const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            lineNumbers: true,
            theme: 'monokai'
          });
          editor.setValue(`// 自作IDEエディタ\nconsole.log("Hello WebContainer");\n`);
        }

        // --- 2. ターミナルの初期化と文字表示 ---
        if (Terminal) {
          const container = document.getElementById('terminal-container');
          if (container) {
            // 既存の古い表示を一度クリアする安全弁
            container.innerHTML = '';

            const term = new Terminal({
              cursorBlink: true,
              theme: { background: '#000000' },
              fontFamily: 'Courier New, monospace',
              fontSize: 16
            });
            
            // 画面にターミナルを物理的にマウント（固定）
            term.open(container);
            
            if (FitAddon) {
              const fitAddon = new FitAddon();
              term.loadAddon(fitAddon);
              fitAddon.fit();
            }

            // 【超重要】マウント直後に一瞬だけ待ち時間を挟んでから文字を書き込む
            setTimeout(() => {
              term.write('====================================\r\n');
              term.write('       自作 Web IDE 起動成功        \r\n');
              term.write('====================================\r\n');
              term.write('エディタとターミナルの同期が完了しました。\r\n');
              
              if (WebContainer) {
                term.write('WebContainer ライブラリの自動ロードを確認。\r\n');
              } else {
                term.write('WebContainer API の読み込みを待機中...\r\n');
              }
            }, 50);

            // ウィンドウのリサイズ時にもターミナルを自動追従させる
            window.addEventListener('resize', () => {
              if (FitAddon) {
                const fitAddon = new FitAddon();
                term.loadAddon(fitAddon);
                fitAddon.fit();
              }
            });
          }
        }
      }, 200);
    });
  </script>
</body>
</html>
