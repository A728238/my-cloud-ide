<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>
  <!-- xterm.css を CDN から読み込み -->
  <link rel="stylesheet" href="https://jsdelivr.net" />
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #terminal-container { flex: 1; padding: 10px; background: #000; }
  </style>
  
  <!-- ブラウザにモジュールの場所を教える Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "https://jsdelivr.net",
        "xterm": "https://jsdelivr.net",
        "xterm-addon-fit": "https://jsdelivr.net"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div style="padding: 10px; border-bottom: 1px solid #333;">
      <span>自作 Web IDE ターミナル</span>
    </div>
    <div id="terminal-container"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
