<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Serverless IDE</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">

    <header class="bg-gray-800 p-3 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-xl">🚀</span>
            <!-- 言語切り替え -->
            <select id="lang-select" class="bg-gray-700 px-2 py-1 rounded text-sm font-semibold">
                <option value="typescript">TypeScript</option>
                <option value="csharp">C#</option>
                <option value="python">Python</option>
            </select>
        </div>
        <button id="run-btn" class="bg-green-600 hover:bg-green-500 active:scale-95 px-5 py-1.5 rounded text-sm font-bold transition">実行</button>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <div id="editor-container" class="w-full h-2/3 md:h-full md:w-2/3"></div>
        <div class="w-full h-1/3 md:h-full md:w-1/3 flex flex-col bg-black">
            <div class="bg-gray-950 px-3 py-1 text-xs text-gray-500 font-mono border-b border-gray-800">OUTPUT</div>
            <pre id="console-output" class="p-3 font-mono text-sm overflow-y-auto flex-1 text-green-400 whitespace-pre-wrap"></pre>
        </div>
    </main>

    <script>
        let editor;
        
        // 言語ごとの初期コードテンプレート
        const templates = {
            typescript: `console.log("Hello from Deno/TS!");`,
            csharp: `using System;\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C#!");\n    }\n}`,
            python: `print("Hello from Python!")`
        };

        require.config({ paths: { vs: 'https://cloudflare.com' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: templates.typescript,
                language: 'typescript',
                theme: 'vs-dark',
                fontSize: 16,
                automaticLayout: true,
                wordWrap: "on"
            });
        });

        // 言語切り替え時にエディタのモードと中身を自動変更
        document.getElementById('lang-select').addEventListener('change', (e) => {
            const lang = e.target.value;
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(templates[lang]);
        });

        // 実行処理 (HTTPSで提供されている無料のマルチ言語APIへ送信する自作処理)
        document.getElementById('run-btn').addEventListener('click', async () => {
            const code = editor.getValue();
            const lang = document.getElementById('lang-select').value;
            const consoleElem = document.getElementById('console-output');
            consoleElem.innerText = "⏳ Running...\n";

            // ※ ここに前述の Judge0(HTTPS版) や 各種Wasmコンパイラの呼び出し処理を記述します
            // 例：Deno/TS の場合は https://deno.dev へPOST
        });
    </script>
</body>
</html>
