<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Multi-Language IDE v2</title>
    <!-- Tailwind CSS (cdnjs) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Monaco Editor ローダー (cdnjs) -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen select-none">

    <!-- ツールバー -->
    <header class="bg-gray-800 p-3 flex flex-wrap gap-3 items-center justify-between border-b border-gray-700">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold text-green-400">🦕 Cloud IDE</span>
            <select id="lang-select" class="bg-gray-700 text-white px-3 py-1.5 rounded text-sm font-semibold border border-gray-600 focus:outline-none">
                <option value="typescript">TypeScript (Deno)</option>
                <option value="csharp">C# (.NET)</option>
                <option value="python">Python 3</option>
            </select>
        </div>
        <button id="run-btn" class="bg-green-600 hover:bg-green-500 active:scale-95 px-6 py-2 rounded text-sm font-bold transition shadow-lg">
            ▶ 実行
        </button>
    </header>

    <!-- メイン領域 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <div id="editor-container" class="w-full h-2/3 md:h-full md:w-2/3 border-b md:border-b-0 md:border-r border-gray-700"></div>
        <div class="w-full h-1/3 md:h-full md:w-1/3 flex flex-col bg-gray-950">
            <div class="bg-gray-900 px-3 py-1.5 text-xs text-gray-400 font-mono border-b border-gray-800 tracking-wider">CONSOLE OUTPUT</div>
            <pre id="console-output" class="p-3 font-mono text-sm overflow-y-auto flex-1 text-green-300 whitespace-pre-wrap select-text">⏳ エディタを読み込み中...</pre>
        </div>
    </main>

    <script>
        let editor;

        const templates = {
            typescript: `// TypeScript (Deno) の実行テスト\nconst message: string = "Hello from Deno Cloud IDE!";\nconsole.log(message);\n\nconst res = await fetch("https://github.com");\nconsole.log("GitHub API Status:", res.status);`,
            csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C#!");\n    }\n}`,
            python: `# Python 3 の実行テスト\nprint("Hello from Python!")`
        };

        // require が準備できるまでループで監視する安全な起動関数
        function startEditorWithRetry() {
            const consoleElem = document.getElementById('console-output');

            // 1. require がまだ定義されていない場合は、1秒後に再挑戦
            if (typeof require === 'undefined') {
                consoleElem.innerText = "⏳ 外部ライブラリの読み込みを待機中 (リトライします)...";
                setTimeout(startEditorWithRetry, 1000);
                return;
            }

            // 2. require が無事に見つかったらエディタを初期化
            consoleElem.innerText = "✨ エディタの準備が完了しました。";
            
            try {
                require.config({ paths: { vs: 'https://cloudflare.com' } });
                require(['vs/editor/editor.main'], function () {
                    editor = monaco.editor.create(document.getElementById('editor-container'), {
                        value: templates.typescript,
                        language: 'typescript',
                        theme: 'vs-dark',
                        fontSize: 16,
                        automaticLayout: true,
                        wordWrap: "on",
                        minimap: { enabled: false }
                    });
                });
            } catch (err) {
                consoleElem.innerText = `❌ 初期化エラー: ${err.message}`;
            }
        }

        // 読み込み開始
        startEditorWithRetry();

        // 言語切り替え
        document.getElementById('lang-select').addEventListener('change', (e) => {
            if (!editor) return;
            const lang = e.target.value;
            monaco.editor.setModelLanguage(editor.getModel(), lang === 'csharp' ? 'csharp' : lang);
            editor.setValue(templates[lang]);
        });

        // 実行処理
        document.getElementById('run-btn').addEventListener('click', async () => {
            if (!editor) return;
            const code = editor.getValue();
            const lang = document.getElementById('lang-select').value;
            const consoleElem = document.getElementById('console-output');
            
            consoleElem.innerText = "⏳ 実行環境に接続中...\n";

            try {
                if (lang === 'typescript') {
                    const res = await fetch("https://deno.dev", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await res.json();
                    consoleElem.innerText = data.output || data.error || "（出力なし）";
                } else {
                    const payload = {
                        language: lang === 'csharp' ? 'csharp' : 'python',
                        files: [{ name: lang === 'csharp' ? 'main.cs' : 'main.py', content: code }]
                    };
                    const res = await fetch(`https://glot.io{payload.language}/latest`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Token 01234567-89ab-cdef-0123-456789abcdef" 
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    consoleElem.innerText = data.stdout || data.stderr || data.error || "（出力なし）";
                }
            } catch (e) {
                consoleElem.innerText = `❌ 通信エラー: 実行環境に接続できませんでした。\n${e.message}`;
            }
        });
    </script>
</body>
</html>
