<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>
  
  <!-- セキュリティ対策を最優先 -->
  <script src="./coi-serviceworker.js"></script>

  <!-- 自分のサーバーから直接CSSを読み込み -->
  <link rel="stylesheet" href="./libs/xterm.css" />
  
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #terminal-container { flex: 1; padding: 10px; background: #000; }
  </style>

  <!-- 外部CDNを一切排除し、自分のリポジトリ内のファイルを100%信頼する設定 -->
  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "./libs/webcontainer.js",
        "xterm": "./libs/xterm.js",
        "xterm-addon-fit": "./libs/xterm-addon-fit.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div style="padding: 10px; border-bottom: 1px solid #333;">
      <span>自作 Web IDE ターミナル</span>
    </div>
    <div id="terminal-container"></div>
  </div>
  
  <!-- バージョンパラメータを更新して確実に最新をロード -->
  <script type="module" src="./main.js?v=pure-local"></script>
</body>
</html>
