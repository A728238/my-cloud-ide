<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>
  
  <!-- GitHub Pages用のセキュリティ対策（最優先） -->
  <script src="./coi-serviceworker.js"></script>

  <!-- xterm.css は公式CDNから直接安全に読み込み -->
  <link rel="stylesheet" href="https://unpkg.com" />
  
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #terminal-container { flex: 1; padding: 10px; background: #000; }
  </style>

  <!-- 1つのImport Mapで全てのパッケージの「正しいフルURL」を定義（jsdelivrを完全排除） -->
  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "https://unpkg.com",
        "xterm": "https://unpkg.com",
        "xterm-addon-fit": "https://unpkg.com"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div style="padding: 10px; border-bottom: 1px solid #333;">
      <span>自作 Web IDE ターミナル</span>
    </div>
    <div id="terminal-container"></div>
  </div>
  
  <!-- パラメーターを更新して古いキャッシュを完全に破壊 -->
  <script type="module" src="./main.js?update=final"></script>
</body>
</html>
