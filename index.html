<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>
  
  <!-- GitHub Pages用のセキュリティ対策（最優先） -->
  <script src="./coi-serviceworker.js"></script>

  <!-- ローカルのCSSファイルを読み込み -->
  <link rel="stylesheet" href="./libs/xterm.css" />
  
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #terminal-container { flex: 1; padding: 10px; background: #000; }
  </style>

  <!-- 依存ライブラリをUMD形式（自己完結型）で読み込み -->
  <script src="./libs/xterm.js"></script>
  <script src="./libs/xterm-addon-fit.js"></script>
</head>
<body>
  <div id="app">
    <div style="padding: 10px; border-bottom: 1px solid #333;">
      <span>自作 Web IDE ターミナル</span>
    </div>
    <div id="terminal-container"></div>
  </div>
  
  <!-- WebContainer APIのみ、安全な別名CDN（unpkg）から直接モジュールインポート -->
  <script type="module">
    import { WebContainer } from 'https://unpkg.com';
    window.WebContainer = WebContainer;
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
