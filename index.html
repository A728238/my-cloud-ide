<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>
  
  <!-- GitHub Pages用のセキュリティ対策（最優先） -->
  <script src="./coi-serviceworker.js"></script>

  <!-- ローカルのCSSファイルを読み込み -->
  <link rel="stylesheet" href="./libs/xterm.css" />
  
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #terminal-container { flex: 1; padding: 10px; background: #000; }
  </style>

  <!-- xterm関係は自己完結しているローカル版を読み込み -->
  <script src="./libs/xterm.js"></script>
  <script src="./libs/xterm-addon-fit.js"></script>

  <!-- ブラウザに「@webcontainer/api」の正しい取得先を教える（これが正解のURLです） -->
  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "https://jsdelivr.net"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div style="padding: 10px; border-bottom: 1px solid #333;">
      <span>自作 Web IDE ターミナル</span>
    </div>
    <div id="terminal-container"></div>
  </div>
  
  <!-- キャッシュを強制クリアするために ?v=4 に更新 -->
  <script type="module" src="./main.js?v=4"></script>
</body>
</html>
