<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>

  <!-- Service Workerの過去の残骸を強制的に登録解除 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) { registration.unregister(); }
      });
    }
  </script>

  <!-- 安定した cdnjs (Cloudflare) からCSSをロード -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />

  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px; border-bottom: 1px solid #333; font-weight: bold; background: #252526; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 40px); }
    .editor-container { flex: 1; border-right: 1px solid #333; display: flex; flex-direction: column; }
    
    /* 【超重要】ターミナルのサイズが潰れるのを防ぐため、明示的に100%の高さと横幅を強制固定 */
    .terminal-container { 
      flex: 1; 
      padding: 15px; 
      background: #000000 !important; 
      height: 100% !important;
      width: 100% !important;
      box-sizing: border-box;
    }
    .CodeMirror { flex: 1; height: 100%; font-size: 14px; }
    
    /* xterm内部の文字が潰れるバグをCSSで強制的に上書き修正 */
    .xterm .xterm-screen {
      display: block !important;
    }
  </style>

  <!-- エラーの起きない通常のスクリプト形式 -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <div id="app">
    <div class="header">自作 Web IDE 起動テスト（スタイル強制版）</div>
    <div class="main-container">
      <div class="editor-container">
        <textarea id="code-editor"></textarea>
      </div>
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // 画面の準備ができるまでほんの少しだけ待つ
      setTimeout(() => {
        const CodeMirror = window.CodeMirror;
        const Terminal = window.Terminal;

        // 1. エディタの初期化
        if (CodeMirror) {
          const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            lineNumbers: true,
            theme: 'monokai'
          });
          editor.setValue(`// 自作IDEエディタ\nconsole.log("Hello WebContainer");\n`);
        }

        // 2. ターミナルの初期化
        if (Terminal) {
          const container = document.getElementById('terminal-container');
          if (container) {
            container.innerHTML = ''; // 画面を完全にリセット

            // サイズやアドオンを一旦すべて削ぎ落とし、純粋に「文字を出す」ことだけに特化
            const term = new Terminal({
              cursorBlink: true,
              convertEol: true, // 改行コードをブラウザ用に自動変換する安全設定
              theme: { 
                background: '#000000',
                foreground: '#ffffff' // 文字色を真っ白に強制
              }
            });
            
            // 画面にマウント
            term.open(container);
            
            // 【究極の安全弁】マウント後に直接文字を流し込む
            term.write('\x1b[1;32m' + '====================================' + '\x1b[0m\r\n');
            term.write('\x1b[1;32m' + '       自作 Web IDE SYSTEM OK       ' + '\x1b[0m\r\n');
            term.write('\x1b[1;32m' + '====================================' + '\x1b[0m\r\n');
            term.write('ターミナルの文字描画回路が正常に接続されました。\r\n');
            term.write('コマンドの入力を待機しています...\r\n');
          }
        }
      }, 300);
    });
  </script>
</body>
</html>
