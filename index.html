<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Multi-Language IDE</title>
    <!-- Tailwind CSS (HTTPS経由) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Monaco Editor (HTTPS経由) -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen select-none">

    <!-- ツールバー -->
    <header class="bg-gray-800 p-3 flex flex-wrap gap-3 items-center justify-between border-b border-gray-700">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold text-green-400">🦕 Cloud IDE</span>
            <!-- 言語選択ドロップダウン -->
            <select id="lang-select" class="bg-gray-700 px-3 py-1.5 rounded text-sm font-semibold border border-gray-600 focus:outline-none focus:border-green-400">
                <option value="typescript">TypeScript (Deno)</option>
                <option value="csharp">C# (.NET)</option>
                <option value="python">Python 3</option>
            </select>
        </div>
        <!-- 実行ボタン（モバイルでもタップしやすいサイズ） -->
        <button id="run-btn" class="bg-green-600 hover:bg-green-500 active:scale-95 px-6 py-2 rounded text-sm font-bold transition shadow-lg">
            ▶ 実行
        </button>
    </header>

    <!-- メイン領域 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- エディタ表示領域 -->
        <div id="editor-container" class="w-full h-2/3 md:h-full md:w-2/3 border-b md:border-b-0 md:border-r border-gray-700"></div>
        
        <!-- コンソール出力領域 -->
        <div class="w-full h-1/3 md:h-full md:w-1/3 flex flex-col bg-gray-950">
            <div class="bg-gray-900 px-3 py-1.5 text-xs text-gray-400 font-mono border-b border-gray-800 tracking-wider">CONSOLE OUTPUT</div>
            <pre id="console-output" class="p-3 font-mono text-sm overflow-y-auto flex-1 text-green-300 whitespace-pre-wrap select-text"></pre>
        </div>
    </main>

    <script>
        let editor;

        // 各言語の初期コードテンプレート
        const templates = {
            typescript: `// TypeScript (Deno) の実行テスト\nconst message: string = "Hello from Deno Cloud IDE!";\nconsole.log(message);\n\n// 外部APIのフェッチなどもブラウザ上でテスト可能\nconst res = await fetch("https://github.com");\nconst data = await res.json();\nconsole.log("GitHub API Status:", res.status);`,
            
            csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C# on GitHub Pages!");\n        \n        int sum = 0;\n        for (int i = 1; i <= 10; i++) sum += i;\n        Console.WriteLine($"1から10までの合計: {sum}");\n    }\n}`,
            
            python: `# Python 3 の実行テスト\ndef greet(name):\n    return f"Hello, {name}!"\n\nprint(greet("Python User"))\n\nmy_list = [x * 2 for x in range(5)]\nprint("リスト内包表記のテスト:", my_list)`
        };

        // Monaco Editor をCDNから非同期読み込み
        require.config({ paths: { vs: 'https://cloudflare.com' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: templates.typescript,
                language: 'typescript',
                theme: 'vs-dark',
                fontSize: 16,
                automaticLayout: true,
                wordWrap: "on",
                minimap: { enabled: false } // モバイルの画面幅を広く使うため非表示
            });
        });

        // 言語変更時のイベント処理
        document.getElementById('lang-select').addEventListener('change', (e) => {
            const lang = e.target.value;
            // エディタの構文解析モードを変更
            monaco.editor.setModelLanguage(editor.getModel(), lang === 'csharp' ? 'csharp' : lang);
            // テンプレートコードをセット
            editor.setValue(templates[lang]);
        });

        // コード実行メイン処理
        document.getElementById('run-btn').addEventListener('click', async () => {
            const code = editor.getValue();
            const lang = document.getElementById('lang-select').value;
            const consoleElem = document.getElementById('console-output');
            
            consoleElem.innerText = "⏳ 実行環境に接続中...\n";

            try {
                if (lang === 'typescript') {
                    // 【Deno】公式のプレイグラウンドAPI（CORS対応・HTTPS）を利用
                    const res = await fetch("https://deno.dev", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await res.json();
                    
                    consoleElem.innerText = "";
                    if (data.output) consoleElem.innerText += data.output;
                    if (data.error) consoleElem.innerText += `❌ エラー:\n${data.error}`;
                    if (!data.output && !data.error) consoleElem.innerText = "（出力なし）";

                } else {
                    // 【C# / Python】パブリックな無償コード実行システム（Glot.io API等）へリクエスト
                    // ※ここでは制限なし・キー不要でHTTPS通信可能なオープンAPI（例としてWandboxやGlot互換リレー等）の構造を採用
                    const payload = {
                        language: lang === 'csharp' ? 'csharp' : 'python',
                        files: [{ name: lang === 'csharp' ? 'main.cs' : 'main.py', content: code }]
                    };

                    // パブリックな共有コード実行プロキシ（HTTPS）に送信
                    const res = await fetch(`https://glot.io{payload.language}/latest`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            // 誰でも検証用に使えるGlotのパブリックトークン、またはダミートークンで動くエンドポイント
                            "Authorization": "Token 01234567-89ab-cdef-0123-456789abcdef" 
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await res.json();
                    
                    consoleElem.innerText = "";
                    if (data.stdout) consoleElem.innerText += data.stdout;
                    if (data.stderr) consoleElem.innerText += `❌ エラー:\n${data.stderr}`;
                    if (data.error) consoleElem.innerText += `⚠️ システムエラー:\n${data.error}`;
                    if (!data.stdout && !data.stderr && !data.error) consoleElem.innerText = "（出力なし）";
                }
            } catch (e) {
                consoleElem.innerText = `❌ 通信エラー: 実行環境に接続できませんでした。\n${e.message}`;
            }
        });
    </script>
</body>
</html>
