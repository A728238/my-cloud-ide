<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Self-Made Cloud IDE</title>
    <style>
        /* 外部CSS（Tailwind等）に依存せず、すべて標準CSSでスタイリング */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111827; color: #f9fafb; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* ツールバー */
        header { background-color: #1f2937; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-b: 1px solid #374151; }
        .logo { font-size: 1.1rem; font-weight: bold; color: #34d399; }
        select { background-color: #4b5563; color: white; padding: 6px 12px; border-radius: 4px; border: 1px solid #4b5563; font-weight: bold; font-size: 0.9rem; }
        button { background-color: #059669; color: white; padding: 8px 18px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        button:active { transform: scale(0.95); }

        /* メインエリア */
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 768px) { main { flex-direction: row; } }

        /* 自作エディタ部分 */
        .editor-wrapper { width: 100%; height: 65%; position: relative; border-bottom: 1px solid #374151; }
        @media (min-width: 768px) { .editor-wrapper { width: 65%; height: 100%; border-bottom: none; border-right: 1px solid #374151; } }
        
        /* モバイル入力に最適化したテキストエリア */
        #code-editor {
            width: 100%; height: 100%; background-color: #1f2937; color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace; font-size: 16px; padding: 12px;
            border: none; resize: none; outline: none; line-height: 1.5;
            white-space: pre; overflow: auto;
        }

        /* コンソール出力部分 */
        .console-wrapper { width: 100%; height: 35%; background-color: #030712; display: flex; flex-direction: column; }
        @media (min-width: 768px) { .console-wrapper { width: 35%; height: 100%; } }
        .console-title { background-color: #111827; padding: 6px 12px; font-size: 0.75rem; color: #9ca3af; font-family: monospace; border-bottom: 1px solid #1f2937; }
        #console-output { flex: 1; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #6ee7b7; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <!-- ツールバー -->
    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span class="logo">🦕 Cloud IDE</span>
            <select id="lang-select">
                <option value="typescript">TypeScript (Deno)</option>
                <option value="csharp">C# (.NET)</option>
                <option value="python">Python 3</option>
            </select>
        </div>
        <button id="run-btn">▶ 実行</button>
    </header>

    <!-- メイン領域 -->
    <main>
        <!-- 自作テキストエディタ -->
        <div class="editor-wrapper">
            <textarea id="code-editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        </div>
        
        <!-- コンソール出力 -->
        <div class="console-wrapper">
            <div class="console-title">CONSOLE OUTPUT</div>
            <pre id="console-output">✨ 自作エディタ起動完了！\nコードを入力して「▶ 実行」を押してください。</pre>
        </div>
    </main>

    <script>
        const editor = document.getElementById('code-editor');
        const consoleElem = document.getElementById('console-output');

        const templates = {
            typescript: `// TypeScript (Deno) の実行テスト\nconst message: string = "Hello from Deno Pure IDE!";\nconsole.log(message);\n\nconst res = await fetch("https://github.com");\nconsole.log("GitHub API Status:", res.status);`,
            csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C#!");\n    }\n}`,
            python: `# Python 3 の実行テスト\nprint("Hello from Python!")`
        };

        // 初期コードのセット
        editor.value = templates.typescript;

        // 言語切り替え処理
        document.getElementById('lang-select').addEventListener('change', (e) => {
            const lang = e.target.value;
            editor.value = templates[lang];
        });

        // 📱 モバイルコーディング快適化：Tabキーによるインデントを自作サポート
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;

                // 2文字のスペースをインデントとして挿入
                this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
            }
        });

        // コード実行メイン処理
        document.getElementById('run-btn').addEventListener('click', async () => {
            const code = editor.value;
            const lang = document.getElementById('lang-select').value;
            
            consoleElem.innerText = "⏳ 実行環境に接続中...\n";

            try {
                if (lang === 'typescript') {
                    const res = await fetch("https://deno.dev", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await res.json();
                    consoleElem.innerText = data.output || data.error || "（出力なし）";
                } else {
                    const payload = {
                        language: lang === 'csharp' ? 'csharp' : 'python',
                        files: [{ name: lang === 'csharp' ? 'main.cs' : 'main.py', content: code }]
                    };
                    const res = await fetch(`https://glot.io{payload.language}/latest`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Token 01234567-89ab-cdef-0123-456789abcdef" 
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    consoleElem.innerText = data.stdout || data.stderr || data.error || "（出力なし）";
                }
            } catch (e) {
                consoleElem.innerText = `❌ 通信エラー: 実行環境への送信に失敗しました。\n機内モードやネットワーク制限を確認してください。\n詳細: ${e.message}`;
            }
        });
    </script>
</body>
</html>
