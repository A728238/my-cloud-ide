<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE</title>

  <!-- Service Workerの残骸を強制解除 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) { registration.unregister(); }
      });
    }
  </script>

  <!-- スタイルシートの定義 -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  <link rel="stylesheet" href="https://cloudflare.com" />

  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px; border-bottom: 1px solid #333; font-weight: bold; background: #252526; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 40px); }
    .editor-container { flex: 1; border-right: 1px solid #333; display: flex; flex-direction: column; }
    
    /* ターミナルを自作のCSSスタイルで完全再現（xterm.cssへの依存も排除） */
    .terminal-container { 
      flex: 1; 
      padding: 15px; 
      background: #000000 !important; 
      color: #ffffff !important;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      line-height: 1.4;
      overflow-y: auto;
      box-sizing: border-box;
      white-space: pre-wrap;
    }
    .CodeMirror { flex: 1; height: 100%; font-size: 14px; }
    .cursor { display: inline-block; width: 8px; height: 18px; background: #fff; animation: blink 1s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 49% { background: #fff; } 50%, 100% { background: transparent; } }
    .line { margin-bottom: 4px; }
    .green { color: #00ff00; font-weight: bold; }
  </style>

  <!-- エディタ用の最小限のスクリプト（こちらは正常に動いているため残します） -->
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <div id="app">
    <div class="header">自作 Web IDE 起動テスト（完全インライン描画版）</div>
    <div class="main-container">
      <div class="editor-container">
        <textarea id="code-editor"></textarea>
      </div>
      <!-- 外部ライブラリを介さず、HTML要素として直接構築 -->
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // 1. エディタの初期化
      const CodeMirror = window.CodeMirror;
      if (CodeMirror) {
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
          lineNumbers: true,
          theme: 'monokai'
        });
        editor.setValue(`// 自作IDEエディタ\nconsole.log("Hello WebContainer");\n`);
      }

      // 2. 外部ライブラリ（xterm.js）を一切使わず、DOM操作で文字を強制出力する独立回路
      const container = document.getElementById('terminal-container');
      if (container) {
        container.innerHTML = ''; // クリア

        // 1行ずつ文字を追加していく関数
        function addLine(text, isGreen = false) {
          const div = document.createElement('div');
          div.className = 'line';
          if (isGreen) {
            div.innerHTML = `<span class="green">${text}</span>`;
          } else {
            div.textContent = text;
          }
          container.appendChild(div);
        }

        // 文字の強制書き込みを実行
        addLine('====================================', true);
        addLine('       自作 Web IDE HARDWARE OK     ', true);
        addLine('====================================', true);
        addLine('外部CDNに依存しないスタンドアロン描画に成功しました。');
        addLine('ブラウザのレンダリング回路は正常に動作しています。');
        
        // 最後に点滅するカーソルを配置
        const cursorLine = document.createElement('div');
        cursorLine.className = 'line';
        cursorLine.innerHTML = '❯ <span class="cursor"></span>';
        container.appendChild(cursorLine);
      }
    });
  </script>
</body>
</html>
