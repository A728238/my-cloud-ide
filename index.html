<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 Web IDE Pro</title>

  <!-- [対策1] 外部サーバー(Cloudflareなど)へのCSS通信を完全廃止し、すべてのデザインスタイルをここに直接記述します -->
  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px; border-bottom: 1px solid #333; display: flex; gap: 15px; align-items: center; background: #252526; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 40px); }
    .editor-container { flex: 1; border-right: 1px solid #333; display: flex; flex-direction: column; position: relative; }
    
    /* 簡易版の軽量テキストエリアエディタのデザイン */
    .custom-editor { flex: 1; width: 100%; height: 100%; background: #1e1e1e; color: #d4d4d4; border: none; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; resize: none; outline: none; box-sizing: border-box; }
    
    /* スタンドアロンターミナルのデザイン */
    .terminal-container { 
      flex: 1; 
      padding: 15px; 
      background: #000000 !important; 
      color: #ffffff !important;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      line-height: 1.4;
      overflow-y: auto;
      box-sizing: border-box;
      white-space: pre-wrap;
    }
    .line { margin-bottom: 4px; }
    .green { color: #00ff00; font-weight: bold; }
    .cyan { color: #00ffff; }
    .red { color: #ff4d4d; font-weight: bold; }
    
    button { background: #007acc; color: white; border: none; padding: 6px 14px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #0062a3; }
    #run-btn { background: #28a745; }
    #run-btn:hover { background: #218838; }
    .input-area { display: inline; background: transparent; color: #fff; border: none; outline: none; font-family: inherit; font-size: inherit; width: 80%; }
    .cursor { display: inline-block; width: 8px; height: 16px; background: #fff; animation: blink 1s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 49% { background: #fff; } 50%, 100% { background: transparent; } }
  </style>

  <!-- [対策2] 外部へのインポートを1文字も行わない、ESM（モジュール形式）のWebContainer公式コアURLをImport Mapに安全にマウント -->
  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "https://esm.sh"
      }
    }
  </script>
</head>
<body>

  <div id="app">
    <div class="header">
      <span>自作 Web IDE Pro v1.5</span>
      <button id="save-btn">📁 ファイル保存</button>
      <button id="run-btn">▶ 実行 (node index.js)</button>
    </div>
    <div class="main-container">
      <div class="editor-container">
        <!-- CORSでブロックされやすい外部エディタをやめ、100%確実に動く軽量ネイティブエディタに統合 -->
        <textarea id="code-editor" class="custom-editor">// ブラウザで動くNode.jsテスト
const msg = "自作Web IDEの起動に成功しました！";
console.log(msg);
</textarea>
      </div>
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </div>

  <!-- type="module" を指定し、Import Mapから安全にWebContainerコアを直読み -->
  <script type="module">
    import { WebContainer } from '@webcontainer/api';

    window.addEventListener('load', () => {
      setTimeout(async () => {
        const container = document.getElementById('terminal-container');
        if (!container) return;
        
        let webcontainerInstance = null;

        // --- 1. ターミナル描画用関数 ---
        function log(text, type = '') {
          const div = document.createElement('div');
          div.className = 'line';
          if (type === 'green') div.innerHTML = `<span class="green">${text}</span>`;
          else if (type === 'cyan') div.innerHTML = `<span class="cyan">${text}</span>`;
          else if (type === 'red') div.innerHTML = `<span class="red">${text}</span>`;
          else div.textContent = text;
          container.appendChild(div);
          container.scrollTop = container.scrollHeight;
        }

        // 起動メッセージ
        log('====================================', 'green');
        log('        自作 Web IDE Pro 起動        ', 'green');
        log('====================================', 'green');

        // --- 2. コマンド入力プロンプトの描画 ---
        function renderPrompt() {
          const oldPrompt = document.getElementById('active-prompt');
          if (oldPrompt) oldPrompt.removeAttribute('id');
          const oldCursor = document.querySelector('.cursor');
          if (oldCursor) oldCursor.remove();

          const promptLine = document.createElement('div');
          promptLine.className = 'line';
          promptLine.id = 'active-prompt';
          promptLine.innerHTML = `❯ <input type="text" class="input-area"><span class="cursor"></span>`;
          container.appendChild(promptLine);
          
          const input = promptLine.querySelector('.input-area');
          setTimeout(() => { if (input) input.focus(); }, 50);

          input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
              const cmd = input.value.trim();
              input.disabled = true;
              const cursor = promptLine.querySelector('.cursor');
              if (cursor) cursor.remove();
              
              promptLine.innerHTML = `❯ ${cmd}`;
              
              if (cmd) {
                await executeCommand(cmd);
              } else {
                renderPrompt();
              }
            }
          });
        }

        // --- 3. WebContainer 自動ブートシステム ---
        async function bootSystem() {
          log('WebContainer コア: ロード検証中...');

          if (!WebContainer) {
            log('エラー: WebContainerオブジェクトの生成に失敗しました。', 'red');
            return;
          }

          // Service Worker が有効化されて制御下に入るまで待機
          if ('serviceWorker' in navigator && !navigator.serviceWorker.controller) {
            log('セキュリティ環境（Service Worker）の有効化を待機中... (数秒かかります)');
            
            const safetyTimer = setInterval(async () => {
              if (navigator.serviceWorker.controller) {
                clearInterval(safetyTimer);
                log('セキュリティ環境の確立を確認しました！システムを起動します。', 'cyan');
                window.location.reload();
              }
            }, 1000);
            return;
          }

          log('WebContainer コア: 安全性を確認。ブート中...');
          try {
            // 本物のNode.jsを起動
            webcontainerInstance = await WebContainer.boot();
            log('【システムOK】ブラウザ内Node.js環境が立ち上がりました！', 'cyan');
            
            await webcontainerInstance.mount({
              'index.js': {
                file: { contents: 'console.log("Hello WebContainer");' }
              }
            });
            renderPrompt();
          } catch (err) {
            log(`ブートエラー: ${err.message}\nお使いのブラウザでSharedArrayBufferが制限されている可能性があります。`);
            renderPrompt();
          }
        }

        // システムブートシーケンスの開始
        await bootSystem();

        // --- 4. コマンド実行エンジン ---
        async function executeCommand(commandText) {
          if (!webcontainerInstance) {
            log('エラー: まだNode.js環境が立ち上がっていません。');
            renderPrompt();
            return;
          }

          const args = commandText.split(' ');
          const program = args.shift();

          try {
            const process = await webcontainerInstance.spawn(program, args);
            
            process.output.pipeTo(new WritableStream({
              write(data) {
                log(data);
              }
            }));

            await process.exit;
            renderPrompt();
          } catch (err) {
            log(`コマンド実行エラー: ${err.message}`);
            renderPrompt();
          }
        }

        // --- 5. ボタンUIのイベント登録 ---
        const editorElement = document.getElementById('code-editor');

        document.getElementById('save-btn').addEventListener('click', async () => {
          if (!webcontainerInstance || !editorElement) {
            log('エラー: まだNode.js環境が立ち上がっていません。');
            return;
          }
          const code = editorElement.value;
          await webcontainerInstance.fs.writeFile('/index.js', code);
          log('[IDEシステム] index.js を仮想ディスクに保存しました。', 'cyan');
        });

        document.getElementById('run-btn').addEventListener('click', async () => {
          log('[IDEシステム] 実行プロセスをトリガーしました...', 'cyan');
          await executeCommand('node index.js');
        });

        container.addEventListener('click', () => {
          const activeInput = document.querySelector('.input-area:not([disabled])');
          if (activeInput) activeInput.focus();
        });

      }, 300);
    });
  </script>
</body>
</html>
